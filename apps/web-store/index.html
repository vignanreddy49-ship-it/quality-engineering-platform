<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ShopSphere</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;background:#f7f7f7}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}
    button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <h1>ShopSphere</h1>
  <p>Quality Engineering sample e-commerce application</p>
  <section id="products" class="grid" aria-label="Products"></section>
  <script>
    const API = window.location.port === '8080' ? 'http://localhost:8000' : '';
    fetch(`${API}/api/products`).then(r=>r.json()).then(products=>{
      document.querySelector('#products').innerHTML=products.map(p=>`
        <article class="card" data-product-id="${p.id}">
          <h2>${p.name}</h2><p>₹${p.price}</p><p>Stock: ${p.stock}</p>
          <button data-buy="${p.id}">Add to cart</button>
        </article>`).join('');
    });
  </script>
</body>
</html>
