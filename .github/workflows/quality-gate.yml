name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt -r tests/api-python/requirements.txt
      - name: Start API
        run: |
          nohup uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 > /tmp/shopsphere.log 2>&1 &
          sleep 3
      - name: Run API and observability tests
        run: pytest -q tests/api-python tests/observability

  playwright-smoke:
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright dependencies
        working-directory: tests/ui-playwright
        run: npm install
      - name: Install browsers
        working-directory: tests/ui-playwright
        run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          pip install -r apps/api/requirements.txt
          nohup uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 > /tmp/shopsphere.log 2>&1 &
          sleep 3
      - name: Run smoke suite
        working-directory: tests/ui-playwright
        run: npm test
