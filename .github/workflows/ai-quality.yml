name: AI Quality Evaluation

on:
  pull_request:
  workflow_dispatch:

jobs:
  ai-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic AI quality suite
        run: python tests/ai-evaluation/evaluate.py
