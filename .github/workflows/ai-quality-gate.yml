name: AI Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ai-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install pytest==8.3.4
      - name: Run AI evaluation suite
        working-directory: tests/ai-evaluation
        run: pytest -q
